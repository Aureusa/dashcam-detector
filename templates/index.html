<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashcam Detector</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="live-dot" title="stream status"></span>
      <h1>Dashcam Detector</h1>
    </div>
    <div class="meta" id="meta">{{ model }}</div>
  </header>

  <main class="layout">
    <section class="video-panel">
      <div class="video-wrap">
        <img id="stream" src="{{ url_for('video_feed') }}" alt="annotated live stream">
        <div id="overlay" class="overlay hidden" role="status" aria-live="polite">
          <div class="spinner"></div>
          <div id="overlay-text">Stream disconnected &mdash; reconnecting&hellip;</div>
        </div>
      </div>
    </section>

    <aside class="side-panel">
      <section class="card">
        <h2>Performance</h2>
        <div class="stats-grid">
          <div class="stat"><span class="label">Capture</span><span class="value" id="s-cap">&ndash;</span><span class="unit">fps</span></div>
          <div class="stat"><span class="label">Inference</span><span class="value" id="s-inf">&ndash;</span><span class="unit">fps</span></div>
          <div class="stat"><span class="label">Infer time</span><span class="value" id="s-infms">&ndash;</span><span class="unit" id="s-infms-p95">ms</span></div>
          <div class="stat"><span class="label">E2E latency</span><span class="value" id="s-e2e">&ndash;</span><span class="unit" id="s-e2e-p95">ms</span></div>
        </div>
        <dl class="kv">
          <dt>Device</dt><dd id="s-device">&ndash;</dd>
          <dt>Model</dt><dd id="s-model">&ndash;</dd>
          <dt>Capture</dt><dd id="s-res">&ndash;</dd>
          <dt>Frame</dt><dd id="s-frame">&ndash;</dd>
          <dt>Viewers</dt><dd id="s-clients">&ndash;</dd>
          <dt>Uptime</dt><dd id="s-uptime">&ndash;</dd>
        </dl>
      </section>

      <section class="card">
        <h2>Detections <span class="badge" id="det-count">0</span></h2>
        <div class="class-counts" id="class-counts"></div>
        <div class="table-wrap">
          <table class="det-table">
            <thead><tr><th>Label</th><th>Score</th><th>Size (px)</th></tr></thead>
            <tbody id="det-body"><tr class="empty"><td colspan="3">No detections</td></tr></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>Settings</h2>
        <label class="slider-row" for="threshold">
          <span>Score threshold</span>
          <output id="threshold-value">0.50</output>
        </label>
        <input type="range" id="threshold" min="0.1" max="0.9" step="0.01" value="0.5">
        <div class="class-header">
          <span>Classes</span>
          <div class="btn-group">
            <button type="button" id="btn-preset">Driving preset</button>
            <button type="button" id="btn-all">All</button>
            <button type="button" id="btn-none">None</button>
          </div>
        </div>
        <input type="search" id="class-search" placeholder="Filter class list&hellip;" autocomplete="off">
        <div class="class-list" id="class-list"></div>
        <div class="settings-status" id="settings-status" role="status" aria-live="polite"></div>
      </section>
    </aside>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
